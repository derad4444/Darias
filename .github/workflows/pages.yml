name: Deploy docs to GitHub Pages

# shared/docs/public を GitHub Pages（derad4444.github.io/Darias/）へ配信する。
# 以前の配信が止まっていたため復活させる。プライバシーポリシー等の更新もこれで反映される。

on:
  push:
    branches: [main]
    paths:
      - 'shared/docs/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shared/docs/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
